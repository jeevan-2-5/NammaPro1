<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NammaPro</title>
    <link rel="icon" type="image/jpeg" href="/src/assets/images/nammapro_logo_1784180959155.jpg" />
    <script>
      (function() {
        const saved = localStorage.getItem("nammapro_theme") || "dark";
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const active = saved === "system" ? systemTheme : saved;
        document.documentElement.classList.add(active);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
